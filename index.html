<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Поле чудес: Физиология ЦНС</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #1e272e; color: white; padding: 12px; margin: 0; }
        h1 { font-size: 20px; margin: 6px 0; color: #00a8ff; }

        /* Стартовый экран ввода названий команд */
        #setup-screen { max-width: 400px; margin: 30px auto; background: #2f3640; padding: 20px; border-radius: 14px; box-shadow: 0 6px 15px rgba(0,0,0,0.4); }
        #setup-screen h2 { font-size: 18px; color: #fbc531; margin-top: 0; }
        .input-group { margin-bottom: 12px; text-align: left; }
        .input-group label { display: block; font-size: 13px; color: #dcdde1; margin-bottom: 4px; }
        .input-group input { width: 100%; padding: 10px; font-size: 16px; border-radius: 8px; border: 2px solid #00a8ff; background: #1e272e; color: white; box-sizing: border-box; }
        .start-btn { width: 100%; padding: 14px; font-size: 17px; font-weight: bold; background: #4cd137; color: #1e272e; border: none; border-radius: 10px; cursor: pointer; margin-top: 10px; }

        /* Игровой экран */
        #game-screen { display: none; }
        #level-info { font-size: 14px; color: #fbc531; font-weight: bold; margin-bottom: 8px; }
        .teams-bar { display: flex; justify-content: center; gap: 6px; max-width: 650px; margin: 0 auto 10px auto; }
        .team-card { flex: 1; background: #2f3640; padding: 8px 4px; border-radius: 10px; border: 2px solid transparent; cursor: pointer; transition: 0.2s; overflow: hidden; }
        .team-card.active { border-color: #4cd137; background: #353b48; box-shadow: 0 0 10px rgba(76, 209, 55, 0.4); }
        .team-name { font-size: 13px; color: #dcdde1; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .team-score { font-size: 18px; color: #4cd137; font-weight: bold; margin-top: 2px; }

        .question { font-size: 15px; margin: 10px auto; max-width: 650px; background: #2f3640; padding: 12px; border-radius: 10px; line-height: 1.35; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        
        /* Барабан */
        .wheel-box { position: relative; width: 195px; height: 195px; margin: 10px auto; }
        .pointer { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 11px solid transparent; border-right: 11px solid transparent; border-top: 20px solid #ff3f34; z-index: 10; filter: drop-shadow(0 2px 3px rgba(0,0,0,0.5)); }
        canvas { width: 100%; height: 100%; border-radius: 50%; border: 4px solid #fbc531; box-shadow: 0 0 15px rgba(251, 197, 49, 0.3); transition: transform 3.5s cubic-bezier(0.17, 0.67, 0.12, 0.99); }
        
        .controls-row { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
        .spin-btn { padding: 10px 18px; font-size: 15px; font-weight: bold; background: #fbc531; color: #1e272e; border: none; border-radius: 10px; cursor: pointer; }
        .spin-btn:disabled { background: #57606f; color: #a4b0be; cursor: not-allowed; }
        .solve-btn { padding: 10px 14px; font-size: 14px; font-weight: bold; background: #00a8ff; color: #1e272e; border: none; border-radius: 10px; cursor: pointer; }
        .solve-btn:disabled { background: #57606f; color: #a4b0be; cursor: not-allowed; }
        #status-msg { font-size: 15px; font-weight: bold; min-height: 22px; margin: 6px 0; color: #00d8d6; }

        /* Табло и алфавит */
        .word-board { display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; margin: 14px 0; }
        .word-group { display: flex; justify-content: center; flex-wrap: wrap; gap: 4px; }
        .letter-box { width: 26px; height: 34px; border: 2px solid #00a8ff; background: #353b48; font-size: 17px; font-weight: bold; display: flex; align-items: center; justify-content: center; border-radius: 6px; text-transform: uppercase; }
        .letter-box.open { background: #00a8ff; color: #1e272e; }
        .alphabet { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; max-width: 650px; margin: 0 auto; }
        .btn-letter { width: 32px; height: 34px; font-size: 14px; font-weight: bold; cursor: pointer; background: #f5f6fa; color: #1e272e; border: none; border-radius: 6px; }
        .btn-letter:disabled { background: #57606f; color: #a4b0be; cursor: not-allowed; opacity: 0.6; }
        .next-btn { margin-top: 16px; padding: 12px 24px; font-size: 17px; font-weight: bold; background: #4cd137; color: #1e272e; border: none; border-radius: 10px; cursor: pointer; display: none; }
    </style>
</head>
<body>

    <h1>🎡 Поле чудес: Физиология ЦНС</h1>

    <div id="setup-screen">
        <h2>Введите названия команд</h2>
        <div class="input-group">
            <label>Команда 1:</label>
            <input type="text" id="input-team-0" placeholder="Например: Нейроны" value="Команда 1">
        </div>
        <div class="input-group">
            <label>Команда 2:</label>
            <input type="text" id="input-team-1" placeholder="Например: Синапсы" value="Команда 2">
        </div>
        <div class="input-group">
            <label>Команда 3:</label>
            <input type="text" id="input-team-2" placeholder="Например: Аксоны" value="Команда 3">
        </div>
        <button class="start-btn" onclick="startGame()">Начать игру ▶</button>
    </div>

    <div id="game-screen">
        <div id="level-info">Вопрос 1 из 20</div>

        <div class="teams-bar">
            <div class="team-card active" id="team-0" onclick="selectTeam(0)">
                <div class="team-name" id="name-0">Команда 1</div>
                <div class="team-score" id="score-0">0</div>
            </div>
            <div class="team-card" id="team-1" onclick="selectTeam(1)">
                <div class="team-name" id="name-1">Команда 2</div>
                <div class="team-score" id="score-1">0</div>
            </div>
            <div class="team-card" id="team-2" onclick="selectTeam(2)">
                <div class="team-name" id="name-2">Команда 3</div>
                <div class="team-score" id="score-2">0</div>
            </div>
        </div>
        
        <div class="question" id="question-text">Загрузка...</div>

        <div class="wheel-box">
            <div class="pointer"></div>
            <canvas id="wheel" width="300" height="300"></canvas>
        </div>

        <div class="controls-row">
            <button class="spin-btn" id="spin-btn" onclick="spinWheel()">🎲 Крутить барабан</button>
            <button class="solve-btn" id="solve-btn" onclick="solveFullWord()">💡 Назвать слово</button>
        </div>
        <div id="status-msg">Крутите барабан!</div>

        <div class="word-board" id="word-board"></div>
        <div class="alphabet" id="alphabet"></div>
        <button class="next-btn" id="next-btn" onclick="nextLevel()">Следующее слово ➔</button>
    </div>

    <script>
        const levels = [
            { question: "Тормозные вставочные нейроны передних рогов спинного мозга, обеспечивающие возвратное торможение мотонейронов?", answer: "КЛЕТКИ РЕНШОУ" },
            { question: "Состояние резкого угнетения всех рефлексов ниже места поперечной перерезки спинного мозга?", answer: "СПИНАЛЬНЫЙ ШОК" },
            { question: "Восходящий путь задних канатиков спинного мозга, проводящий импульсы проприоцептивной чувствительности от нижних конечностей?", answer: "ТОНКИЙ ПУЧОК" },
            { question: "Внезапная рефлекторная остановка дыхания при раздражении рецепторов верхних дыхательных путей?", answer: "АПНОЭ" },
            { question: "Интегративный нервный центр продолговатого мозга, регулирующий тонус кровеносных сосудов?", answer: "СОСУДОДВИГАТЕЛЬНЫЙ ЦЕНТР" },
            { question: "Защитный рефлекс продолговатого мозга, направленный на очищение трахеи и бронхов от инородных частиц?", answer: "КАШЕЛЬ" },
            { question: "Структура варолиева моста, тормозящая центр вдоха и регулирующая смену фаз дыхательного цикла?", answer: "ПНЕВМОТАКСИЧЕСКИЙ ЦЕНТР" },
            { question: "Как называется безусловный рефлекс сужения зрачка в ответ на воздействие света, осуществляемый при участии претектальной области и добавочных ядер глазодвигательного нерва?", answer: "ЗРАЧКОВЫЙ РЕФЛЕКС" },
            { question: "Третья пара черепных нервов, ядра которой лежат в среднем мозге и иннервируют мышцы глаза?", answer: "ГЛАЗОДВИГАТЕЛЬНЫЙ НЕРВ" },
            { question: "Дофаминергическая структура среднего мозга, регулирующая тонкую пластику движений и тонус?", answer: "ЧЕРНАЯ СУБСТАНЦИЯ" },
            { question: "Резкое повышение тонуса мышц-разгибателей при перерезке ствола мозга ниже красных ядер?", answer: "ДЕЦЕРЕБРАЦИОННАЯ РИГИДНОСТЬ" },
            { question: "Парное ядро среднего мозга, посылающее импульсы к сгибателям и уравновешивающее тонус экстензоров?", answer: "КРАСНОЕ ЯДРО" },
            { question: "Сетевидное образование ствола мозга, оказывающее восходящее активирующее влияние на кору?", answer: "РЕТИКУЛЯРНАЯ ФОРМАЦИЯ" },
            { question: "Рефлекс среднего мозга, проявляющийся поворотом головы и глаз в сторону внезапного раздражителя?", answer: "ОРИЕНТИРОВОЧНЫЙ РЕФЛЕКС" },
            { question: "Гигантские пирамидные нейроны пятого слоя первичной моторной коры больших полушарий?", answer: "КЛЕТКИ БЕЦА" },
            { question: "Извилина лобной доли коры больших полушарий, где расположена первичная моторная зона?", answer: "ПРЕЦЕНТРАЛЬНАЯ ИЗВИЛИНА" },
            { question: "Как называется нисходящий двигательный путь, образованный аксонами нейронов моторной коры и обеспечивающий проведение импульсов к двигательным нейронам спинного мозга?", answer: "ПИРАМИДНЫЙ ПУТЬ" },
