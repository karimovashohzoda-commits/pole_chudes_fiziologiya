<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Поле чудес: Физиология ЦНС</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #0d1b2a; color: white; padding: 14px; margin: 0; }
        h1 { font-size: 26px; margin: 6px 0; color: #f59e0b; text-align: left; max-width: 600px; margin-left: auto; margin-right: auto; }
        .subtitle { font-size: 14px; color: #cbd5e1; text-align: left; max-width: 600px; margin: 0 auto 16px auto; line-height: 1.4; }

        #setup-screen { max-width: 600px; margin: 0 auto; text-align: left; }
        .card-box { background: #1b263b; padding: 16px; border-radius: 14px; margin-bottom: 14px; border: 1px solid #334155; }
        .card-title { font-size: 16px; font-weight: bold; color: #f59e0b; margin-bottom: 12px; }
        
        .btn-group { display: flex; gap: 8px; margin-bottom: 12px; }
        .choice-btn { flex: 1; padding: 10px; font-size: 15px; font-weight: bold; background: #0f172a; color: #e2e8f0; border: 2px solid #334155; border-radius: 10px; cursor: pointer; }
        .choice-btn.selected { border-color: #f59e0b; color: #f59e0b; background: #1e293b; }

        .team-input { width: 100%; padding: 12px; font-size: 15px; border-radius: 10px; border: 1px solid #334155; background: #0f172a; color: white; box-sizing: border-box; margin-bottom: 8px; }
        .start-btn { width: 100%; padding: 15px; font-size: 18px; font-weight: bold; background: #f59e0b; color: #0f172a; border: none; border-radius: 12px; cursor: pointer; margin-top: 6px; }

        #game-screen { display: none; max-width: 650px; margin: 0 auto; }
        #level-info { font-size: 14px; color: #f59e0b; font-weight: bold; margin-bottom: 8px; }
        .teams-bar { display: flex; justify-content: center; gap: 6px; margin-bottom: 10px; }
        .team-card { flex: 1; background: #1b263b; padding: 8px 4px; border-radius: 10px; border: 2px solid #334155; cursor: pointer; overflow: hidden; }
        .team-card.active { border-color: #10b981; background: #1e293b; box-shadow: 0 0 10px rgba(16, 185, 129, 0.35); }
        .team-name { font-size: 13px; color: #e2e8f0; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .team-score { font-size: 18px; color: #10b981; font-weight: bold; margin-top: 2px; }

        .question { font-size: 15px; margin: 10px auto; background: #1b263b; padding: 14px; border-radius: 12px; line-height: 1.4; border: 1px solid #334155; }
        
        .wheel-box { position: relative; width: 195px; height: 195px; margin: 10px auto; }
        .pointer { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 11px solid transparent; border-right: 11px solid transparent; border-top: 20px solid #ef4444; z-index: 10; }
        canvas { width: 100%; height: 100%; border-radius: 50%; border: 4px solid #f59e0b; transition: transform 3.5s cubic-bezier(0.17, 0.67, 0.12, 0.99); }
        
        .controls-row { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
        .spin-btn { padding: 11px 18px; font-size: 15px; font-weight: bold; background: #f59e0b; color: #0f172a; border: none; border-radius: 10px; cursor: pointer; }
        .spin-btn:disabled { background: #475569; color: #94a3b8; cursor: not-allowed; }
        .solve-btn { padding: 11px 14px; font-size: 14px; font-weight: bold; background: #38bdf8; color: #0f172a; border: none; border-radius: 10px; cursor: pointer; }
        .solve-btn:disabled { background: #475569; color: #94a3b8; cursor: not-allowed; }
        #status-msg { font-size: 15px; font-weight: bold; min-height: 22px; margin: 6px 0; color: #38bdf8; }

        .word-board { display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; margin: 14px 0; }
        .word-group { display: flex; justify-content: center; flex-wrap: wrap; gap: 4px; }
        .letter-box { width: 26px; height: 34px; border: 2px solid #38bdf8; background: #1e293b; font-size: 17px; font-weight: bold; display: flex; align-items: center; justify-content: center; border-radius: 6px; text-transform: uppercase; }
        .letter-box.open { background: #38bdf8; color: #0f172a; }
        .alphabet { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; margin: 0 auto; }
        .btn-letter { width: 32px; height: 34px; font-size: 14px; font-weight: bold; cursor: pointer; background: #f8fafc; color: #0f172a; border: none; border-radius: 6px; }
        .btn-letter:disabled { background: #475569; color: #94a3b8; cursor: not-allowed; opacity: 0.6; }
        .next-btn { margin-top: 16px; padding: 12px 24px; font-size: 17px; font-weight: bold; background: #10b981; color: #0f172a; border: none; border-radius: 10px; cursor: pointer; display: none; }
    </style>
</head>
<body>

    <h1>Поле чудес</h1>
    <div class="subtitle">Физиология центральной нервной системы.<br>Тема: Спинной мозг, ствол и моторная кора</div>

    <div id="setup-screen">
        <div class="card-box">
            <div class="card-title">Команды</div>
            <div class="btn-group">
                <button class="choice-btn" id="cnt-2" onclick="setTeamCount(2)">2 команды</button>
                <button class="choice-btn selected" id="cnt-3" onclick="setTeamCount(3)">3 команды</button>
                <button class="choice-btn" id="cnt-4" onclick="setTeamCount(4)">4 команды</button>
            </div>
            <div id="team-inputs">
                <input type="text" class="team-input" id="input-team-0" value="Команда 1" placeholder="Команда 1">
                <input type="text" class="team-input" id="input-team-1" value="Команда 2" placeholder="Команда 2">
                <input type="text" class="team-input" id="input-team-2" value="Команда 3" placeholder="Команда 3">
            </div>
        </div>

        <div class="card-box">
            <div class="card-title">Сколько слов в игре</div>
            <div class="btn-group">
                <button class="choice-btn" id="wcnt-5" onclick="setWordCount(5)">5</button>
                <button class="choice-btn" id="wcnt-10" onclick="setWordCount(10)">10</button>
                <button class="choice-btn" id="wcnt-15" onclick="setWordCount(15)">15</button>
                <button class="choice-btn selected" id="wcnt-20" onclick="setWordCount(20)">20</button>
            </div>
        </div>

        <button class="start-btn" onclick="startGame()">Начать игру ▶</button>
    </div>

    <div id="game-screen">
        <div id="level-info">Вопрос 1 из 20</div>
        <div class="teams-bar" id="teams-bar"></div>
        <div class="question" id="question-text">Загрузка...</div>

        <div class="wheel-box">
            <div class="pointer"></div>
            <canvas id="wheel" width="300" height="300"></canvas>
        </div>

        <div class="controls-row">
            <button class="spin-btn" id="spin-btn" onclick="spinWheel()">🎲 Крутить барабан</button>
            <button class="solve-btn" id="solve-btn" onclick="solveFullWord()">💡 Назвать слово</button>
        </div>
        <div id="status-msg">Крутите барабан!</div>

        <div class="word-board" id="word-board"></div>
        <div class="alphabet" id="alphabet"></div>
        <button class="next-btn" id="next-btn" onclick="nextLevel()">Следующее слово ➔</button>
    </div>

    <script>
        const allLevels = [
            { question: "Тормозные вставочные нейроны передних рогов спинного мозга, обеспечивающие возвратное торможение мотонейронов?", answer: "КЛЕТКИ РЕНШОУ" },
            { question: "Состояние резкого угнетения всех рефлексов ниже места поперечной перерезки спинного мозга?", answer: "СПИНАЛЬНЫЙ ШОК" },
            { question: "Восходящий путь задних канатиков спинного мозга, проводящий импульсы проприоцептивной чувствительности от нижних конечностей?", answer: "ТОНКИЙ ПУЧОК" },
            { question: "Внезапная рефлекторная остановка дыхания при раздражении рецепторов верхних дыхательных путей?", answer: "АПНОЭ" },
            { question: "Интегративный нервный центр продолговатого мозга, регулирующий тонус кровеносных сосудов?", answer: "СОСУДОДВИГАТЕЛЬНЫЙ ЦЕНТР" },
            { question: "Защитный рефлекс продолговатого мозга, направленный на очищение трахеи и бронхов от инородных частиц?", answer: "КАШЕЛЬ" },
            { question: "Структура варолиева моста, тормозящая центр вдоха и регулирующая смену фаз дыхательного цикла?", answer: "ПНЕВМОТАКСИЧЕСКИЙ ЦЕНТР" },
            { question: "Как называется безусловный рефлекс сужения зрачка в ответ на воздействие света, осуществляемый при участии претектальной области и добавочных ядер глазодвигательного нерва?", answer: "ЗРАЧКОВЫЙ РЕФЛЕКС" },
            { question: "Третья пара черепных нервов, ядра которой лежат в среднем мозге и иннервируют мышцы глаза?", answer: "ГЛАЗОДВИГАТЕЛЬНЫЙ НЕРВ" },
            { question: "Дофаминергическая структура среднего мозга, регулирующая тонкую пластику движений и тонус?", answer: "ЧЕРНАЯ СУБСТАНЦИЯ" },
            { question: "Резкое повышение тонуса мышц-разгибателей при перерезке ствола мозга ниже красных ядер?", answer: "ДЕЦЕРЕБРАЦИОННАЯ РИГИДНОСТЬ" },
            { question: "Парное ядро среднего мозга, посылающее импульсы к сгибателям и уравновешивающее тонус экстензоров?", answer: "КРАСНОЕ ЯДРО" },
            { question: "Сетевидное образование ствола мозга, оказывающее восходящее активирующее влияние на кору?", answer: "РЕТИКУЛЯРНАЯ ФОРМАЦИЯ" },
            { question: "Рефлекс среднего мозга, проявляющийся поворотом головы и глаз в сторону внезапного раздражителя?", answer: "ОРИЕНТИРОВОЧНЫЙ РЕФЛЕКС" },
            { question: "Гигантские пирамидные нейроны пятого слоя первичной моторной коры больших полушарий?", answer: "КЛЕТКИ БЕЦА" },
